<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Math Super Revision Show – Grade 1 Addition & Subtraction</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:"Baloo 2","Fredoka","Chalkboard SE","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;color:#1f3a68;user-select:none;-webkit-user-select:none}
body{background:radial-gradient(circle at 30% 20%,#3b2f9c,#14123a 70%)}
button{font-family:inherit;cursor:pointer}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center center;border-radius:26px;overflow:hidden;
  background:radial-gradient(circle at 15% 20%,#fff 0 2px,transparent 3px) 0 0/46px 46px,linear-gradient(160deg,#e6f1ff,#fbefff 55%,#fff6dc);box-shadow:0 20px 80px #000a}
/* header */
#top{position:absolute;top:0;left:0;right:0;height:64px;background:linear-gradient(90deg,#2f6fed,#7b5cff);color:#fff;display:flex;align-items:center;gap:22px;padding:0 22px;z-index:20;box-shadow:0 4px 16px rgba(47,111,237,.28)}
.logo{font:900 26px/1 inherit;letter-spacing:.5px;white-space:nowrap}
.live{background:#e8244b;border-radius:10px;font-size:15px;padding:3px 9px;margin-left:8px;animation:blink 1.4s infinite;vertical-align:middle}
.prog{flex:1;display:flex;align-items:center;gap:12px}
.bar{flex:1;height:18px;background:rgba(255,255,255,.3);border-radius:12px;overflow:hidden}
#barfill{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd45e,#ffb300);border-radius:12px;transition:width .5s}
#plabel{font:800 20px/1 inherit;min-width:70px}
.tools{display:flex;align-items:center;gap:10px}
.tbtn{border:none;background:rgba(255,255,255,.25);color:#fff;font-size:24px;width:44px;height:44px;border-radius:50%;transition:transform .15s,background .15s}
.tbtn:hover{transform:scale(1.1);background:rgba(255,255,255,.38)}
.score{background:#fff;color:#e08a00;border-radius:26px;padding:4px 18px;font:900 26px/1 inherit;display:flex;gap:8px;align-items:center;box-shadow:0 4px 10px rgba(0,0,0,.15)}
.score.bump{animation:tada .6s}
/* main */
#main{position:absolute;top:64px;bottom:64px;left:0;right:0}
#host{position:absolute;left:0;top:0;bottom:0;width:250px;display:flex;flex-direction:column;align-items:center;padding:10px 8px;background:linear-gradient(180deg,rgba(255,255,255,.45),rgba(255,255,255,.15));border-right:3px dashed rgba(123,92,255,.22)}
#main.nohost #host{display:none}
#slides{position:absolute;top:0;bottom:0;left:250px;right:0}
#main.nohost #slides{left:0}
.bubble{background:#fff;border:4px solid #7b5cff;border-radius:24px;padding:10px 12px;font:800 20px/1.2 inherit;min-height:84px;width:228px;position:relative;text-align:center;display:flex;align-items:center;justify-content:center;margin-bottom:16px;color:#3b2f9c;box-shadow:0 6px 16px rgba(123,92,255,.15)}
.bubble:after{content:"";position:absolute;bottom:-20px;left:50px;border:12px solid transparent;border-top:16px solid #7b5cff}
.mascot{width:155px;height:155px;animation:bob 2.4s ease-in-out infinite;cursor:pointer;filter:drop-shadow(0 8px 12px rgba(255,159,26,.3))}
.m-open{display:none}
#host.cheer .m-open{display:block}#host.cheer .m-smile{display:none}
#host.cheer .mascot{animation:jump .5s 3}
#host.oops .mascot{animation:tilt .6s 2}
.hostname{font:800 17px/1.1 inherit;color:#7b5cff;margin-top:2px}
/* host real photo card */
.host-photo-box{margin-top:8px;width:216px;background:#fff;border:4px solid #ffb300;border-radius:20px;padding:6px;box-shadow:0 8px 18px rgba(0,0,0,.12);text-align:center;cursor:pointer;transition:transform .2s,border-color .2s}
.host-photo-box:hover{transform:scale(1.04);border-color:#2f6fed}
.host-photo-box img{width:100%;height:122px;object-fit:cover;border-radius:14px;display:block}
.host-photo-cap{font:800 14px/1.2 inherit;color:#1f3a68;margin-top:4px;display:flex;align-items:center;justify-content:center;gap:4px}
/* footer */
#bottom{position:absolute;bottom:0;left:0;right:0;height:64px;background:#fff;border-top:4px solid #e3e8f5;display:flex;align-items:center;justify-content:space-between;padding:0 22px;z-index:20}
.credit{font:800 20px/1 inherit;color:#7b5cff;display:flex;align-items:center;gap:10px}
.btn{font:800 26px/1 inherit;padding:9px 28px;border-radius:30px;border:none;background:var(--c,#2f6fed);color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.2);transition:transform .1s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.btn:disabled{opacity:.35;pointer-events:none}
.btn.mini{font-size:20px;padding:6px 18px}
.btn.big{font-size:38px;padding:12px 42px;--c:#22a06b}
#prev{--c:#8a7bff}#next{--c:#22a06b}
.glow{animation:glow 1s infinite}
/* slides */
.slide{position:absolute;inset:0;padding:10px 24px 6px 10px;display:none;flex-direction:column;gap:8px}
.slide.full{padding:0}
.slide.active{display:flex;animation:slideIn .5s ease-out}
.t-blue{--c:#2f6fed;--cl:#dbe9ff}.t-pink{--c:#e8467c;--cl:#ffe0ea}.t-green{--c:#22a06b;--cl:#dcf5e8}
.t-purple{--c:#7b5cff;--cl:#ebe5ff}.t-yellow{--c:#e6a100;--cl:#fff1c2}.t-orange{--c:#ff7a2f;--cl:#ffe8d6}
.brow{display:flex;align-items:center;gap:14px}
.banner{background:var(--c);color:#fff;font:900 27px/1 inherit;padding:8px 24px;border-radius:16px;letter-spacing:.5px;box-shadow:0 4px 12px rgba(0,0,0,.12)}
.tag{background:#1f3a68;color:#ffd45e;font:900 18px/1 inherit;padding:6px 14px;border-radius:12px}
.body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:0}
.instr{font:800 26px/1.2 inherit;color:#35507d;text-align:center}
.instr b{color:var(--c)}
.pi{opacity:0}.go .pi{animation:popin .55s both;animation-delay:calc(var(--i,0)*.35s + .15s)}
/* number line */
.nlwrap{width:94%;max-width:930px;background:linear-gradient(180deg,#f2fbff 0%,#fff 65%,#e7f9ee 100%);border:4px solid var(--cl);border-radius:24px;padding:4px 10px;box-shadow:0 8px 22px rgba(31,58,104,.08);position:relative}
.nl-pond-badge{position:absolute;top:8px;right:12px;display:flex;align-items:center;gap:8px;background:#fff;border:3px solid #22a06b;border-radius:16px;padding:4px 10px 4px 4px;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.1);transition:transform .2s;z-index:3}
.nl-pond-badge:hover{transform:scale(1.06)}
.nl-pond-badge img{width:54px;height:40px;object-fit:cover;border-radius:10px}
.nl-pond-badge span{font:800 14px/1.1 inherit;color:#1b7a50;text-align:left}
.nl{width:100%;height:auto;display:block}
.nl .frog{transition:transform .25s ease-out}
.nl .hit{fill:transparent;cursor:pointer;transition:fill .2s}
.nl .hit:hover{fill:rgba(47,111,237,.18)}
.nl .hit.bad{fill:rgba(232,70,124,.55)}.nl .hit.good{fill:rgba(34,160,107,.6)}
.nl .arc{animation:fadein .35s}
.bigeq{font:900 58px/1 inherit;color:#1f3a68;display:flex;align-items:center;gap:12px}
.blank{display:inline-block;min-width:74px;border-bottom:6px dashed var(--c,#2f6fed);text-align:center;color:var(--c,#2f6fed)}
.blank.filled{border-bottom:6px solid #22a06b;color:#22a06b;animation:tada .6s}
.cap{font:800 28px/1.1 inherit;color:#35507d;min-height:36px;text-align:center}
.strip{background:var(--cl);border:3px dashed var(--c);color:var(--c);font:800 24px/1.1 inherit;padding:7px 22px;border-radius:18px}
.eqrow{display:flex;align-items:center;gap:22px;flex-wrap:wrap;justify-content:center}
.nlq{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
/* questions */
.qwrap{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}
.qwrap.side{flex-direction:row;gap:22px;justify-content:center;align-items:center}
.parts{display:flex;flex-direction:column;gap:10px;align-items:center}
.parts.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;width:100%}
.qb{display:flex;flex-direction:column;align-items:center;gap:8px;background:#fff;border:4px solid var(--cl);border-radius:24px;padding:12px 18px;box-shadow:0 6px 18px rgba(0,0,0,.06)}
.qb.hidden{display:none}
.qb.solved{border-color:#22a06b;background:#f7fff9}
.qb:not(.hidden){animation:popin .4s}
.qprompt{font:800 32px/1.2 inherit;text-align:center;color:#1f3a68}
.choices{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.choice{font:900 42px/1 inherit;min-width:106px;padding:10px 24px;border-radius:22px;border:none;color:#fff;box-shadow:0 7px 0 rgba(0,0,0,.2);transition:transform .12s}
.choice:active{transform:translateY(4px)}
.c0{background:#5b8def}.c1{background:#a06bff}.c2{background:#ff9f43}.c3{background:#1fb5c9}
.choices.text .choice{font-size:28px;padding:10px 18px}
.choices.tf .choice{font-size:32px}
.choices.eq .choice{font-size:38px}
.choices.eqc .choice{font-size:38px}
.parts.cols .choice{font-size:36px;min-width:80px;padding:8px 16px}
.choice.right{background:#22a06b!important;animation:tada .6s}
.choice.right:after{content:" ✓"}
.choice.wrong{background:#c9ced6!important;color:#8a93a3;box-shadow:none;animation:shake .4s;text-decoration:line-through}
.choices.locked .choice:not(.right){opacity:.4;pointer-events:none}
.hint{background:#fff6cc;border:3px solid #ffc233;border-radius:16px;padding:6px 16px;font:700 22px/1.2 inherit;display:none;color:#7a5a00}
.hint.show{display:block;animation:popin .4s}
/* enhanced story cards with real interactive photos */
.story{background:#fff;border:4px solid var(--cl);border-radius:24px;padding:12px 16px;width:475px;text-align:center;box-shadow:0 10px 24px rgba(0,0,0,.08)}
.story-photo-wrap{position:relative;width:100%;height:165px;border-radius:18px;overflow:hidden;border:3px solid var(--c,#e6a100);margin-bottom:8px;cursor:pointer}
.story-photo-wrap img{width:100%;height:100%;object-fit:cover;transition:transform .35s ease}
.story-photo-wrap:hover img,.story-photo-wrap.zoomed img{transform:scale(1.12)}
.story-photo-pill{position:absolute;bottom:8px;right:8px;background:rgba(31,58,104,.86);color:#ffd45e;font:800 14px/1 inherit;padding:5px 10px;border-radius:12px;backdrop-filter:blur(4px)}
.story .sc{font-size:44px;line-height:1}
.story .st{font:800 24px/1.22 inherit;margin:4px 0}
.story .sv{font-size:38px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;margin-top:4px}
.story .sv b{font-size:44px;color:var(--c)}
.tap-item{display:inline-flex;align-items:center;justify-content:center;position:relative;cursor:pointer;padding:2px 4px;border-radius:12px;transition:transform .15s,background .15s}
.tap-item:hover{transform:scale(1.18);background:#fff5c0}
.tap-item.counted{background:#dcf5e8;transform:scale(1.1)}
.tap-item .cnt-badge{position:absolute;top:-8px;right:-6px;background:#2f6fed;color:#fff;font:900 14px/1 inherit;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 5px rgba(0,0,0,.25)}
.tap-tip{font:800 15px/1 inherit;color:#7b5cff;margin-top:4px}
.more{background:var(--cl);border-radius:16px;padding:2px 8px;display:inline-flex;gap:4px}
.gone{opacity:.3;filter:grayscale(1)}
/* ten frame */
.tf{--cs:80px;display:grid;grid-template-columns:repeat(5,var(--cs));grid-auto-rows:var(--cs);border:5px solid #2f4f8f;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 8px 20px rgba(47,79,143,.15)}
.cell{border:2.5px solid #2f4f8f;display:flex;align-items:center;justify-content:center;position:relative}
.cell.empty{cursor:pointer}.cell.empty:hover{background:#fff4d6}
.dot{width:72%;height:72%;border-radius:50%;background:var(--dc,#22a06b);animation:popin .35s;box-shadow:inset -4px -4px 0 rgba(0,0,0,.16),inset 4px 4px 0 rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;font-size:34px}
.dot.help{background:#ff7aa8}
.tfwrap{background:#fff;border:4px solid var(--cl);border-radius:22px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 8px 20px rgba(0,0,0,.06)}
.tf-photo-bar{display:flex;align-items:center;gap:10px;background:#f4fbf7;border:3px solid #bce8d0;border-radius:16px;padding:5px 10px;width:100%}
.tf-photo-bar img{width:64px;height:48px;object-fit:cover;border-radius:10px;border:2px solid #22a06b}
.tf-switch{display:flex;gap:6px;flex-wrap:wrap}
.tf-sbtn{border:2px solid #22a06b;background:#fff;color:#1f3a68;border-radius:12px;padding:3px 9px;font:800 15px/1.1 inherit;transition:transform .12s,background .12s}
.tf-sbtn.on{background:#22a06b;color:#fff;transform:scale(1.05)}
.tfrow{display:flex;gap:28px;align-items:center;justify-content:center}
.bigtxt{font:900 46px/1.2 inherit;text-align:center}
/* fact family */
.house{display:flex;flex-direction:column;align-items:center}
.roof{width:250px;height:115px;background:#ff8a3d;clip-path:polygon(50% 0,100% 100%,0 100%);display:flex;align-items:flex-end;justify-content:center;font:900 64px/1 inherit;color:#fff;padding-bottom:6px}
.rooms{display:flex}.rooms span{width:125px;height:105px;background:#ffe3a6;border:5px solid #ff8a3d;display:flex;align-items:center;justify-content:center;font:900 62px/1 inherit;color:#1f3a68}
.ff-photo-card{background:#fff;border:4px solid #d6c8ff;border-radius:20px;padding:8px;width:230px;text-align:center;box-shadow:0 8px 18px rgba(123,92,255,.12);cursor:pointer;transition:transform .2s}
.ff-photo-card:hover{transform:scale(1.04)}
.ff-photo-card img{width:100%;height:118px;object-fit:cover;border-radius:14px}
.ff-photo-card p{font:800 16px/1.2 inherit;color:#3b2f9c;margin-top:5px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fcard{background:#fff;border:5px solid #2f6fed;border-radius:22px;padding:10px 22px;font:900 46px/1 inherit;display:flex;gap:12px;align-items:center;justify-content:center}
.fcard.sub{border-color:#e8467c}
.feq{background:#fff;border:5px solid var(--cl);border-radius:22px;padding:8px 20px;font:900 50px/1 inherit;display:flex;gap:12px;align-items:center;justify-content:center}
.feq .plus{color:#2f6fed}.feq .minus{color:#e8467c}
.slot{width:84px;height:84px;border:5px dashed var(--c);border-radius:20px;background:#faf8ff;display:inline-flex;align-items:center;justify-content:center;font:900 52px/1 inherit;color:#22a06b}
.slot.filled{border:5px solid #22a06b;background:#e6f8ee;animation:tada .6s}
.chips{display:flex;gap:22px;justify-content:center;margin-top:4px}
.chip{width:86px;height:86px;border-radius:50%;font:900 52px/1 inherit;display:flex;align-items:center;justify-content:center;color:#fff;background:#ff8a3d;box-shadow:0 7px 0 rgba(0,0,0,.2);touch-action:none;cursor:grab}
.chip.sel{outline:6px solid #ffd45e;transform:scale(1.1)}
.chip.lifted{opacity:.3}
.chip.used{opacity:.15;pointer-events:none}
.chip.ghost{position:fixed;z-index:999;pointer-events:none;margin:0}
.chip.k0{background:#5b8def}.chip.k1{background:#a06bff}.chip.k2{background:#ff8a3d}.chip.k3{background:#1fb5c9}
/* word problems */
.wcards{display:flex;gap:24px;justify-content:center;width:100%}
.wcard{background:#fff;border:5px solid var(--wc);border-radius:26px;padding:12px 18px;width:460px;text-align:center;box-shadow:0 10px 24px rgba(0,0,0,.08)}
.wcard-img{width:100%;height:142px;object-fit:cover;border-radius:16px;border:3px solid var(--wc);margin-bottom:6px;cursor:pointer;transition:transform .25s}
.wcard-img:hover{transform:scale(1.04)}
.wcard .wh{font:900 30px/1.1 inherit;color:var(--wc)}
.wcard .wt{font:800 24px/1.2 inherit;margin:4px 0}
.wcard .wv{font-size:36px;line-height:1.2;min-height:54px;display:flex;align-items:center;justify-content:center;gap:4px;flex-wrap:wrap}
.badge{display:inline-block;background:var(--wc);color:#fff;font:900 24px/1 inherit;padding:6px 20px;border-radius:20px;margin-top:6px}
/* matching */
.mcols{display:flex;gap:64px;justify-content:center;align-items:center}
.mcol{display:flex;flex-direction:column;gap:12px}
.mitem{background:#fff;border:5px solid var(--cl);border-radius:20px;padding:8px 16px;font:800 26px/1.1 inherit;min-width:410px;text-align:left;cursor:pointer;transition:transform .15s;display:flex;align-items:center;gap:12px;box-shadow:0 4px 12px rgba(0,0,0,.06)}
.mitem img{width:66px;height:50px;object-fit:cover;border-radius:12px;border:2px solid #ff7a2f;flex-shrink:0}
.mitem.r{min-width:240px;font-size:40px;font-weight:900;justify-content:center;text-align:center;padding:14px 20px}
.mitem.sel{border-color:#ffb300;background:#fff6d8;transform:scale(1.05)}
.mitem.matched{pointer-events:none;color:#fff}
.mitem.m0.matched{background:#2f6fed;border-color:#2f6fed}.mitem.m1.matched{background:#e8467c;border-color:#e8467c}
.mitem.m2.matched{background:#22a06b;border-color:#22a06b}.mitem.m3.matched{background:#7b5cff;border-color:#7b5cff}
.mitem.bad{animation:shake .4s;border-color:#e8467c}
/* balloons */
.gtop{display:flex;align-items:center;gap:20px}
.gprog{background:#1f3a68;color:#ffd45e;font:900 22px/1 inherit;padding:5px 16px;border-radius:14px}
.gq{font:900 48px/1.1 inherit;text-align:center;min-height:58px}
.gq small{font-size:32px;font-weight:800}
.arena{position:relative;width:960px;height:290px;background:linear-gradient(#bfe3ff,#eaf7ff);border:4px solid #fff;border-radius:26px;overflow:hidden;box-shadow:inset 0 8px 24px rgba(47,111,237,.15)}
.balloon{position:absolute;top:50px;width:150px;height:185px;border:none;border-radius:50% 50% 48% 48%/60% 60% 40% 40%;color:#fff;font:900 62px/1 inherit;box-shadow:inset -14px -14px 0 rgba(0,0,0,.14),inset 12px 12px 0 rgba(255,255,255,.25);animation:bob 2.2s ease-in-out infinite;transition:transform .3s,opacity .4s}
.balloon:after{content:"";position:absolute;left:50%;top:100%;width:3px;height:70px;background:#6b7a99}
.balloon.b0{background:#ff5c8a}.balloon.b1{background:#ffb300}.balloon.b2{background:#2f9bff}.balloon.b3{background:#8a5cff}
.balloon.pop{transform:scale(1.7);opacity:0;animation:none}
.balloon.away{transform:translateY(-260px);opacity:0;animation:none;pointer-events:none}
.gmsg{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;font:900 46px/1.1 inherit;background:rgba(255,255,255,.88);color:#e08a00;gap:6px}
/* final quiz */
.qdots{display:flex;gap:8px}
.qdots i{width:22px;height:22px;border-radius:50%;background:#d6def0}
.qdots i.on{background:#ffb300}.qdots i.ok{background:#22a06b}
.qb .nlwrap{width:640px}
.fq-photo{display:flex;align-items:center;gap:12px;background:#f8faff;border:3px solid #dbe9ff;border-radius:16px;padding:6px 12px}
.fq-photo img{width:88px;height:66px;object-fit:cover;border-radius:12px;border:2px solid #2f6fed}
/* opening / celebration */
.open{background:radial-gradient(circle at 50% 30%,#fff7d6,#cfe0ff 45%,#b9a7ff);overflow:hidden}
.open .curt{position:absolute;top:0;bottom:0;width:51%;z-index:6;background:repeating-linear-gradient(90deg,#c0213f 0 44px,#a3162f 44px 88px);box-shadow:0 0 40px #0006;transition:transform 1.8s cubic-bezier(.7,0,.3,1) .5s}
.open .curt.l{left:0}.open .curt.r{right:0}
.open.go .curt.l{transform:translateX(-103%)}.open.go .curt.r{transform:translateX(103%)}
.ocen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;z-index:3}
.welcome{font:900 26px/1 inherit;color:#7b5cff;letter-spacing:5px}
.otitle{font:900 74px/.94 inherit;text-align:center;color:#1f3a68;text-shadow:0 6px 0 rgba(255,255,255,.8)}
.otitle b{display:inline-block;animation:bounceIn .8s both}
.otitle b:nth-child(4n+1){color:#2f6fed}.otitle b:nth-child(4n+2){color:#e8467c}.otitle b:nth-child(4n+3){color:#22a06b}.otitle b:nth-child(4n){color:#ff8a3d}
.ribbon{background:#e8467c;color:#fff;font:900 26px/1 inherit;padding:6px 34px;border-radius:14px;box-shadow:0 6px 0 rgba(0,0,0,.18)}
.hero-gallery{display:flex;gap:12px;justify-content:center;align-items:center;margin:6px 0}
.hero-card{background:#fff;border:4px solid #fff;border-radius:18px;padding:4px;width:136px;box-shadow:0 8px 18px rgba(31,58,104,.18);cursor:pointer;transition:transform .22s,border-color .22s;text-align:center}
.hero-card:hover{transform:translateY(-8px) scale(1.07);border-color:#ffb300}
.hero-card img{width:100%;height:84px;object-fit:cover;border-radius:12px;display:block}
.hero-card span{font:800 13px/1.1 inherit;color:#1f3a68;display:block;margin-top:3px}
.omasc svg{width:110px;height:110px;animation:bob 2s ease-in-out infinite}
.ocredit{font:800 20px/1 inherit;color:#3b2f9c;background:rgba(255,255,255,.65);padding:4px 18px;border-radius:20px}
.float{position:absolute;font:900 54px/1 inherit;opacity:.5;animation:float 6s ease-in-out infinite;z-index:1}
.win{background:radial-gradient(circle at 50% 30%,#fff7d6,#ffe0f0 50%,#d9ccff);align-items:center;justify-content:center;gap:6px;overflow:hidden}
.win h1{font:900 62px/1 inherit;color:#e8467c;text-shadow:0 5px 0 #fff;text-align:center}
.trophy{font-size:84px;animation:jump 1s infinite}
.stars{font-size:60px;letter-spacing:10px}
.wscore{background:#fff;border:5px solid #ffb300;border-radius:26px;padding:6px 32px;font:900 38px/1 inherit;color:#e08a00}
.recap{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;font:800 22px/1 inherit}
.recap span{background:#fff;border-radius:16px;padding:6px 14px;border:3px solid #b9a7ff}
/* objective cards with real photos */
.ocard{width:300px;height:186px;background:#fff;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px;text-align:center;font:800 22px/1.15 inherit;cursor:pointer;box-shadow:0 8px 18px rgba(0,0,0,.08);transition:transform .2s}
.ocard:hover{transform:translateY(-6px) scale(1.03)}
.ocard-top{display:flex;align-items:center;gap:10px}
.ocard-top img{width:84px;height:62px;object-fit:cover;border-radius:12px;border:3px solid currentColor}
/* fx */
#fx{position:absolute;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.praise{position:absolute;left:50%;top:44%;font:900 88px/1 inherit;color:#ffd45e;-webkit-text-stroke:3px #1f3a68;text-shadow:0 8px 0 #1f3a68;white-space:nowrap;animation:pop 1.25s both}
.praise.soft{font-size:52px;color:#fff;background:#ff8a3d;-webkit-text-stroke:0;text-shadow:none;padding:10px 30px;border-radius:30px;top:30%}
.cf{position:absolute;top:-40px;animation:fall 1.9s ease-in forwards}
#rotate{display:none;position:fixed;inset:0;background:#14123a;color:#fff;z-index:9999;flex-direction:column;align-items:center;justify-content:center;gap:18px;font:800 28px/1.2 inherit;text-align:center;padding:20px}
@media (orientation:portrait) and (max-width:700px){#rotate.show{display:flex}}
@keyframes slideIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes popin{from{opacity:0;transform:scale(.6) translateY(20px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes jump{0%,100%{transform:translateY(0)}50%{transform:translateY(-34px) rotate(8deg)}}
@keyframes tilt{0%,100%{transform:rotate(0)}30%{transform:rotate(-9deg)}70%{transform:rotate(9deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(7px)}}
@keyframes tada{0%{transform:scale(1)}30%{transform:scale(1.25) rotate(-4deg)}60%{transform:scale(1.15) rotate(4deg)}100%{transform:scale(1)}}
@keyframes glow{0%,100%{box-shadow:0 6px 0 rgba(0,0,0,.2),0 0 0 0 rgba(34,160,107,.7)}50%{box-shadow:0 6px 0 rgba(0,0,0,.2),0 0 0 16px rgba(34,160,107,0);transform:scale(1.08)}}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}25%{transform:translate(-50%,-50%) scale(1.15);opacity:1}70%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-60%) scale(1.05);opacity:0}}
@keyframes fall{to{transform:translate(var(--dx),780px) rotate(var(--r))}}
@keyframes blink{50%{opacity:.5}}
@keyframes float{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-30px) rotate(8deg)}}
@keyframes bounceIn{0%{opacity:0;transform:translateY(-80px) scale(.5)}60%{opacity:1;transform:translateY(10px) scale(1.1)}100%{transform:none}}
</style>
</head>

/* ---------- sound ---------- */
var ac=null;
function tone(f,t,d,type,v){if(S.muted)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();var o=ac.createOscillator(),g=ac.createGain();o.type=type||'sine';o.frequency.value=f;var t0=ac.currentTime+t;g.gain.setValueAtTime(v||.15,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);o.connect(g);g.connect(ac.destination);o.start(t0);o.stop(t0+d+.05);}catch(e){}}
function sndOk(){[523,659,784,1047].forEach(function(f,i){tone(f,i*.09,.25);});}
function sndNo(){tone(220,0,.18,'triangle');tone(196,.14,.25,'triangle');}
function sndHop(n){tone(330+n*45,0,.15,'square',.05);}
$('#btnMute').onclick=function(){S.muted=!S.muted;this.textContent=S.muted?'🔕':'🔔';};

/* ---------- host + feedback ---------- */
var slideSay='',hostT=null;
function hostSay(t,ms,mood){bubble.textContent=t;hostEl.classList.remove('cheer','oops');if(mood)hostEl.classList.add(mood);clearTimeout(hostT);
  hostT=setTimeout(function(){bubble.textContent=slideSay;hostEl.classList.remove('cheer','oops');},ms||1800);}
var PRAISE=['Excellent!','Fantastic!','Well Done!',"You're a Super Star!",'Awesome!','Great Job!'],pidx=0;
function confetti(n){var em=['⭐','🎉','✨','💛','🌟','🎊','💙','💚'];for(var i=0;i<n;i++){(function(i){var c=el('div','cf',em[i%em.length]);c.style.left=Math.random()*100+'%';c.style.setProperty('--dx',(Math.random()*200-100)+'px');c.style.setProperty('--r',(Math.random()*720-360)+'deg');c.style.animationDelay=Math.random()*.4+'s';c.style.fontSize=(22+Math.random()*22)+'px';fx.appendChild(c);setTimeout(function(){c.remove();},2500);})(i);}}
function bannerFx(txt,cls){var b=el('div','praise '+(cls||''),txt);fx.appendChild(b);setTimeout(function(){b.remove();},1300);}
function praise(big){var t=PRAISE[pidx++%PRAISE.length];sndOk();bannerFx(t+' ⭐');confetti(big===false?10:30);hostSay(t,2000,'cheer');}
function oops(){var m=['Oops! Try again! 💪','Almost! Look again 👀','Good try! You can do it!','Try once more! 🌈'];var t=m[Math.floor(Math.random()*m.length)];sndNo();bannerFx(t,'soft');hostSay(t,1800,'oops');}
function reg(id){if(!(id in S.done)){S.done[id]=null;S.max+=10;}}
function award(id,w){if(S.done[id]!=null)return;var p=w===0?10:w===1?7:5;S.done[id]=p;S.score+=p;var s=$('#score');s.textContent=S.score;var pe=s.parentElement;pe.classList.remove('bump');void pe.offsetWidth;pe.classList.add('bump');}
function replay(r){r.classList.remove('go');void r.offsetWidth;r.classList.add('go');}

function updateHostPhoto(slideIdx){
  var img=$('#hostPhotoImg'),cap=$('#hostPhotoCap');
  if(!img||!cap)return;
  if(slideIdx>=2&&slideIdx<=10){img.src=IMG.frog;cap.textContent='🐸 Pond Frog Number Line!';}
  else if(slideIdx>=11&&slideIdx<=14){img.src=IMG.apples;cap.textContent='🍎 Count to 10 Apples!';}
  else if(slideIdx>=15&&slideIdx<=16){img.src=IMG.birds;cap.textContent='🐦 Fact Family Songbirds!';}
  else if(slideIdx===17||slideIdx===18){img.src=IMG.mia;cap.textContent='👧 Mia & Star Stickers!';}
  else if(slideIdx===19){img.src=IMG.ali;cap.textContent='👦 Ali & Toy Cars!';}
  else if(slideIdx===20){img.src=IMG.cookies;cap.textContent='🍪 Match the Math Story!';}

}

/* ---------- interactive tap-to-count helper ---------- */
function makeTappableVisual(htmlStr){
  var wrap=el('div','sv-wrap');
  var row=el('div','sv',htmlStr);
  var tip=el('div','tap-tip','👆 Tap each picture to count it out loud!');
  wrap.appendChild(row);wrap.appendChild(tip);
  var count=0;
  Array.prototype.slice.call(row.querySelectorAll('.tap-item')).forEach(function(item){
    item.onclick=function(){
      if(item.classList.contains('counted')){
        item.classList.remove('counted');
        var b=item.querySelector('.cnt-badge');if(b)b.remove();
        count=Math.max(0,count-1);
      }else{
        count++;
        item.classList.add('counted');
        var b2=el('span','cnt-badge',count);
        item.appendChild(b2);
        sndHop(count);
        hostSay('Count: '+count+'! ⭐',1100,'cheer');
      }
    };
  });
  return wrap;
}

      c.onclick=function(){
        if(c.classList.contains('empty')){

function qBlock(q,ctx,onSolved){
  ctx.need(q.id);reg(q.id);
  var box=el('div','qb');
  if(q.visual)box.appendChild(typeof q.visual==='function'?q.visual():el('div','qvis',q.visual));
  var p=el('div','qprompt say',q.prompt);box.appendChild(p);
  var row=el('div','choices '+(q.cls||'num'));box.appendChild(row);
  var hint=el('div','hint');box.appendChild(hint);
  var wrongs=0,solved=false;
  q.choices.forEach(function(c,i){
    var b=el('button','choice c'+(i%4),c);
    b.onclick=function(){
      if(solved||b.disabled)return;
      if(i===q.answer){
        solved=true;b.classList.add('right');row.classList.add('locked');hint.classList.remove('show');
        if(q.blank){p.querySelectorAll('.blank').forEach(function(x){x.innerHTML=(q.fill!=null?q.fill:c);x.classList.add('filled');});}
        award(q.id,wrongs);praise(true);box.classList.add('solved');
        if(onSolved)onSolved();ctx.check();
      }else{
        wrongs++;b.classList.add('wrong');b.disabled=true;oops();
        if(q.hint){hint.textContent='💡 '+q.hint;hint.classList.add('show');}
      }
    };
    row.appendChild(b);
  });
  return box;
}
function qSlide(cfg){
  return {theme:cfg.theme,tag:cfg.tag||'YOUR TURN ⭐',banner:cfg.banner,say:cfg.say,build:function(body,ctx){

}

    function mv(ev){if(!moved&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>8){moved=true;ghost=c.cloneNode(true);ghost.className='chip ghost k'+cl.indexOf(c);ghost.style.transform='translate(-50%,-50%) scale('+scale+')';document.body.appendChild(ghost);c.classList.add('lifted');}
      if(ghost){ghost.style.left=ev.clientX+'px';ghost.style.top=ev.clientY+'px';}}
    function end(ev){window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',end);window.removeEventListener('pointercancel',end);
      if(moved){ghost.remove();c.classList.remove('lifted');if(ev.type==='pointerup'){var t=document.elementFromPoint(ev.clientX,ev.clientY);var s=t&&t.closest?t.closest('.slot'):null;if(s)drop(c,s);}}
      else if(ev.type==='pointerup'){if(sel===c){clearSel();}else{clearSel();sel=c;c.classList.add('sel');}}}
    window.addEventListener('pointermove',mv);window.addEventListener('pointerup',end);window.addEventListener('pointercancel',end);});});
  slots.forEach(function(s){s.addEventListener('click',function(){if(sel){var c=sel;clearSel();drop(c,s);}});});
}});

/* ---------- build + navigation ---------- */
var secs=[];
function slideDone(i){var ids=secs[i].ids;if(!ids.size)return false;var ok=true;ids.forEach(function(id){if(S.done[id]==null)ok=false;});return ok;}
function refreshNav(){$('#prev').disabled=cur<=0;$('#next').disabled=cur>=defs.length-1;
  $('#next').classList.toggle('glow',cur>0&&cur<defs.length-1&&slideDone(cur));}
defs.forEach(function(d,i){
  var s=el('section','slide '+(d.theme||'')+(d.full?' full':'')+(d.cls?' '+d.cls:''));s.ids=new Set();
  var ctx={need:function(id){s.ids.add(id);},check:function(){refreshNav();}};
  var target=s;
  if(!d.full){s.appendChild(el('div','brow','<div class="banner say">'+d.banner+'</div>'+(d.tag?'<div class="tag">'+d.tag+'</div>':'')));var b=el('div','body');s.appendChild(b);target=b;}
  var r=d.build(target,ctx)||{};s.onEnter=r.onEnter;s.onLeave=r.onLeave;
  slidesEl.appendChild(s);secs.push(s);});
function go(i){
  if(i<0||i>=defs.length||i===cur)return;
  if(window.speechSynthesis)window.speechSynthesis.cancel();
  if(cur>=0){secs[cur].classList.remove('active');if(secs[cur].onLeave)secs[cur].onLeave();}
  cur=i;var s=secs[i],d=defs[i];s.classList.add('active');
  $('#main').classList.toggle('nohost',!!d.full);
  slideSay=d.say||'';bubble.textContent=slideSay;hostEl.classList.remove('cheer','oops');
  updateHostPhoto(i);
  $('#barfill').style.width=((i+1)/defs.length*100)+'%';$('#plabel').textContent=(i+1)+' / '+defs.length;
  refreshNav();if(s.onEnter)s.onEnter();
  var tw=function(){};tw();
}
$('#next').onclick=function(){go(cur+1);};
$('#prev').onclick=function(){go(cur-1);};
document.addEventListener('keydown',function(e){if(e.key==='ArrowRight')go(cur+1);else if(e.key==='ArrowLeft')go(cur-1);});
$('#btnRead').onclick=function(){
  if(!window.speechSynthesis)return;window.speechSynthesis.cancel();
  var parts=Array.prototype.slice.call(secs[cur].querySelectorAll('.banner,.say')).map(function(e){return e.textContent;});parts.push(bubble.textContent);
  var t=parts.join('. ').replace(/−/g,' minus ').replace(/\+/g,' plus ').replace(/=/g,' equals ').replace(/\?/g,' what ').replace(/[\u2600-\u27BF\u2B50\u{1F000}-\u{1FFFF}]/gu,'');
  var u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.85;u.pitch=1.1;window.speechSynthesis.speak(u);};
go(0);
})();
